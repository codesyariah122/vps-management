<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        VPS Management
        {% endblock %}
    </title>

    <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}?v=202609112230">
</head>

<body>

    <header class="mobile-topbar">
        <a class="mobile-brand" href="/"><img class="brand-logo" src="{{ url_for('static', path='images/wangun-techno.svg') }}" alt="Wangun Techno"><span>VPS Management</span></a>
        <button id="mobile-menu-toggle" class="mobile-menu-toggle" type="button" aria-label="Open navigation" aria-expanded="false">☰</button>
    </header>

    <button id="mobile-menu-backdrop" class="mobile-menu-backdrop" type="button" aria-label="Close navigation"></button>

    <aside class="sidebar">

        <div class="brand"><img class="brand-logo" src="{{ url_for('static', path='images/wangun-techno.svg') }}" alt="Wangun Techno"><span>VPS Management <small>Operations Console</small></span></div>

        <nav>

            <a class="{% if request.url.path == '/' %}active{% endif %}" href="/">
                Dashboard
            </a>

            <a class="{% if request.url.path == '/servers' %}active{% endif %}" href="/servers">
                Servers
            </a>

            <a class="{% if request.url.path == '/projects' %}active{% endif %}" href="/projects">
                Projects
            </a>

            <a class="{% if request.url.path == '/services' %}active{% endif %}" href="/services">
                Services
            </a>

            <a class="{% if request.url.path == '/nginx' %}active{% endif %}" href="/nginx">
                Nginx
            </a>

            <a class="{% if request.url.path == '/logs' %}active{% endif %}" href="/logs">
                Logs
            </a>

            <a class="{% if request.url.path == '/maintenance' %}active{% endif %}" href="/maintenance">
                Maintenance
            </a>

            <a class="{% if request.url.path == '/settings' %}active{% endif %}" href="/settings">
                Settings
            </a>

        </nav>

    </aside>


    <main class="main">

        {% block content %}
        {% endblock %}

        <footer class="app-footer"><span>VPS Management</span><span>Built by <strong>Wangun Techno Dev Team</strong></span></footer>

    </main>


    <script src="{{ url_for('static', path='js/app.js') }}?v=202609112230"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        VPS Management
        {% endblock %}
    </title>

    <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}">
</head>

<body>

    <aside class="sidebar">

        <div class="brand"><span class="brand-mark">V</span><span>VPS Management</span></div>

        <nav>

            <a class="{% if request.url.path == '/' %}active{% endif %}" href="/">
                Dashboard
            </a>

            <a class="{% if request.url.path == '/servers' %}active{% endif %}" href="/servers">
                Servers
            </a>

            <a class="{% if request.url.path == '/projects' %}active{% endif %}" href="/projects">
                Projects
            </a>

            <a class="{% if request.url.path == '/services' %}active{% endif %}" href="/services">
                Services
            </a>

            <a class="{% if request.url.path == '/nginx' %}active{% endif %}" href="/nginx">
                Nginx
            </a>

            <a class="{% if request.url.path == '/logs' %}active{% endif %}" href="/logs">
                Logs
            </a>

            <a class="{% if request.url.path == '/settings' %}active{% endif %}" href="/settings">
                Settings
            </a>

        </nav>

    </aside>


    <main class="main">

        {% block content %}
        {% endblock %}

    </main>


    <script src="{{ url_for('static', path='js/app.js') }}"></script>

</body>

</html>
